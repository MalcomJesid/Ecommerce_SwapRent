<!DOCTYPE html >
<html lang="en" xmlns:th="http://www.thymeleaf.org/" th:fragment="layout (links, title, content, footer, scripts)">
<head>
    <meta charset="UTF-8">
    <title th:replace="${title}">Swap Rent</title>
    <th:block th:replace="${links}" />
    <link rel="stylesheet" th:href="@{css/styles.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
<header id="navs" th:insert="~{base/navbar :: navs}"></header>
<section id="section" th:replace="${content}">Content</section>
<footer id="footer" th:insert="~{base/footer :: footer}"></footer>

<th:block th:replace="${scripts}" />
<script th:src="@{js/script.js}"></script>
<script th:src="@{js/customer.js}"></script>

</body>

</html>
